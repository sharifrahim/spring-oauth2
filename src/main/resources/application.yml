spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
profile:
  require-completion: false
security:
  web:
    allow-h2-console: ${ALLOW_H2_CONSOLE:false}
  rate-limiting:
    enabled: true
    ip-max-attempts: 10
    email-max-attempts: 5
    time-window-in-minutes: 15
    block-duration-in-minutes: 60
logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
