spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oauth2}
    username: ${SPRING_DATASOURCE_USERNAME:oauth2}
    password: ${SPRING_DATASOURCE_PASSWORD:oauth2}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
profile:
  require-completion: false
security:
  rate-limiting:
    enabled: true
    ip-max-attempts: 10
    email-max-attempts: 5
    time-window-in-minutes: 15
    block-duration-in-minutes: 60
logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
