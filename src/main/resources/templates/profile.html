<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILE CONFIGURATION</title>
    <link href="/css/retro.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>USER PROFILE :: CONFIGURATION CONSOLE</h1>

        <div class="ascii-art">
.------------------------------------.
|   *** COMPLETE USER PROFILE ***    |
'------------------------------------'
        </div>

        <form th:action="@{/profile}" method="post" th:object="${form}" class="form-card">
            <div class="form-group">
                <label for="displayName">> Display Name</label>
                <input type="text" id="displayName" name="displayName" th:value="*{displayName}" />
                <p class="form-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></p>
            </div>

            <div class="form-group">
                <label for="phoneNumber">> Phone Number</label>
                <input type="text" id="phoneNumber" name="phoneNumber" th:value="*{phoneNumber}" />
            </div>

            <div class="form-group">
                <label for="company">> Company</label>
                <input type="text" id="company" name="company" th:value="*{company}" />
            </div>

            <div class="form-group inline-actions">
                <button type="submit" class="btn">[SAVE] > WRITE PROFILE</button>
                <a href="/dashboard" class="link">[SKIP] > RETURN TO DASHBOARD</a>
            </div>

            <div th:if="${profileRequired}" class="alert-warning">
                > NOTICE: PROFILE COMPLETION REQUIRED PRIOR TO FULL ACCESS.
            </div>
        </form>
    </div>
</body>
</html>
