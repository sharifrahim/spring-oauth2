<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="/css/retro.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Edit Profile</h1>
        <p style="text-align: center; color: #6b7280; margin-bottom: 32px;">
            Update your personal information below.
        </p>

        <div th:if="${profileRequired}" class="alert-warning">
            Please complete your profile to continue.
        </div>

        <form th:action="@{/profile}" method="post" th:object="${form}">
            <div class="form-group">
                <label for="displayName">Display Name *</label>
                <input type="text" id="displayName" name="displayName" th:value="*{displayName}" required />
                <p class="form-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></p>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="text" id="phoneNumber" name="phoneNumber" th:value="*{phoneNumber}" />
            </div>

            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company" th:value="*{company}" />
            </div>

            <div class="inline-actions">
                <button type="submit" class="btn">Save Changes</button>
                <a href="/dashboard" class="link" style="text-align: center; display: block; margin-top: 16px;">← Back to Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
