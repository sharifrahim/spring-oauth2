<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="/css/retro.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>Dashboard</h1>

        <div th:if="${session.accountLinkSuccess}" class="alert-success">
            <span th:text="${session.accountLinkSuccess}"></span>
        </div>
        <div th:if="${session.accountLinkError}" class="alert-error">
            <span th:text="${session.accountLinkError}"></span>
        </div>

        <div style="background: #f9fafb; padding: 20px; border-radius: 8px; margin-bottom: 24px;">
            <p style="margin: 8px 0; color: #374151;">
                <strong>Name:</strong> <span th:text="${displayName} ?: 'Not set'"></span>
            </p>
            <p style="margin: 8px 0; color: #374151;">
                <strong>Email:</strong> <span th:text="${userEmail} ?: 'Unknown'"></span>
            </p>
            <p style="margin: 8px 0; color: #374151;">
                <strong>Status:</strong> <span th:text="${accountStatus} ?: 'Unknown'"></span>
            </p>
            <p style="margin: 8px 0; color: #374151;">
                <strong>Time:</strong> <span id="system-time"></span>
            </p>
        </div>

        <div th:if="${profile != null}" class="dashboard-section">
            <h3>Profile Information</h3>
            <p th:if="${profile.phoneNumber}">
                <strong>Phone:</strong> <span th:text="${profile.phoneNumber}"></span>
            </p>
            <p th:if="${profile.company}">
                <strong>Company:</strong> <span th:text="${profile.company}"></span>
            </p>
        </div>

        <div th:if="${profile == null}" class="alert-warning">
            Your profile is incomplete. <a href="/profile" class="link">Complete your profile</a>
        </div>

        <div style="margin-top: 32px;">
            <a href="/profile" class="btn">Edit Profile</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn" style="background: #6b7280;">Sign Out</button>
            </form>
        </div>
    </div>

    <script>
        function updateTime() {
            document.getElementById('system-time').innerText = new Date().toLocaleString();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
